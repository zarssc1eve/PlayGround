<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>SHADOW DISTRICT</title>
  <style>
    :html,body,#game{width:100%;height:100%;margin:0;overflow:hidden;background:#05070a;font-family:Inter,Segoe UI,sans-serif;color:#eef8ff}
    canvas{display:block;width:100%;height:100%;image-rendering:auto}
    #hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;border:1px solid rgba(115,210,230,.18);background:linear-gradient(135deg,rgba(7,14,20,.88),rgba(10,20,25,.55));backdrop-filter:blur(8px);border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
    #bars{left:28px;bottom:28px;width:275px;padding:14px} .bar{height:10px;background:#071014;border:1px solid rgba(255,255,255,.08);margin-top:7px}.fill{height:100%;transition:width .15s}.hp{background:linear-gradient(90,#bb2d33,#ef6060)}.st{background:linear-gradient(90,#3b8f9c,#78d8df)}
    #mission{right:28px;top:28px;width:280px;padding:16px}.eyebrow{font-size:10px;letter-spacing:3px;color:#65c9d2;text-transform:uppercase}.mission-name{font-weight:800;margin:8px 0 5px;font-size:15px}#objective{font-size:12px;color:#bdd0d4;line-height:1.5}
    #mapWrap{left:28px;top:28px;width:178px;height:178px;border-radius:50%;overflow:hidden;padding:0}#map{width:100%;height:100%}.compass{position:absolute;top:8px;left:18px;width:142px;text-align:center;color:#9edfe5;font-size:10px;letter-spacing:5px}
    #weapon{right:28px;bottom:28px;text-align:right;padding:12px 16px}.weapon-name{font-size:14px;font-weight:800}.ammo{font-size:32px;font-weight:900;color:#d7fbff} .ammo small{font-size:11px;color:#78949a}
    #cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);border:1px solid rgba(220,250,255,.8);border-radius:50%;box-shadow:0 0 8px #80d4dd}.cross:after{content:'';position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;left:4px;top:4px}
    #prompt{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);font-size:12px;letter-spacing:1px;padding:8px 12px;display:none}.key{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid #82bfc5;border-radius:3px;margin-right:7px;color:#bff8ff}
    #menu{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,8,11,.72);backdrop-filter:blur(10px);pointer-events:auto}#menu.show{display:grid}.card{width:min(520px,calc(100% - 40px));padding:24px}.card h2{margin:0 0 16px;letter-spacing:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid rgba(130,210,220,.16);padding:12px;background:rgba(12,24,28,.8)}button{pointer-events:auto;border:1px solid #6eb8c2;background:rgba(17,36,41,.9);color:#dffcff;padding:10px 12px;margin:4px;cursor:pointer}button:hover{background:#1b4950}.resource{font-size:12px;color:#94adb2}.close{float:right}
    #start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(20,70,80,.32),#030608 70%);z-index:20}.title{font-size:clamp(42px,8vw,92px);letter-spacing:14px;font-weight:900;text-shadow:0 0 35px rgba(91,206,220,.25)}.subtitle{letter-spacing:8px;color:#75bec7;font-size:12px;margin:10px 0 32px}.start-btn{font-size:15px;letter-spacing:3px;padding:15px 32px}.hidden{display:none!important}
    #toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);padding:10px 16px;border-left:2px solid #71ccd5;background:rgba(5,13,16,.86);opacity:0;transition:.25s}.touch{display:none;position:absolute;pointer-events:auto}#joy{left:20px;bottom:34px;width:118px;height:118px;border:1px solid rgba(150,220,225,.25);border-radius:50%}.stick{position:absolute;width:48px;height:48px;border-radius:50%;left:35px;top:35px;background:rgba(130,210,215,.28);border:1px solid rgba(180,240,240,.45)}.action{right:24px;bottom:38px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(150,220,225,.35);background:rgba(25,55,58,.6)}
    @media(max-width:700px){#mission{right:10px;top:10px;width:190px}.mission-name{font-size:12px}#objective{font-size:10px}#mapWrap{left:10px;top:10px;width:112px;height:112px}.compass{display:none}#bars{left:10px;bottom:14px;width:190px}#weapon{right:10px;bottom:142px}.touch{display:grid}.action{display:none}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="start"><div><div class="title">SHADOW DISTRICT</div><div class="subtitle">NIGHT 04 · QUARANTINE ZONE</div><button class="start-btn" id="startBtn">ENTER THE DISTRICT</button></div></div>
  <div id="hud">
    <div id="mapWrap" class="panel"><canvas id="map" width="178" height="178"></canvas><div class="compass">N · E · S · W</div></div>
    <div id="mission" class="panel"><div class="eyebrow">ACTIVE CONTRACT</div><div class="mission-name" id="missionName">Signal in the Dark</div><div id="objective">Collect 3 salvage units</div></div>
    <div id="bars" class="panel"><div style="display:flex;justify-content:space-between;font-size:12px"><span>VITALS</span><span id="level">LVL 1</span></div><div class="bar"><div id="hp" class="fill hp" style="width:100%"></div></div><div class="bar"><div id="stamina" class="fill st" style="width:100%"></div></div></div>
    <div id="weapon" class="panel"><div class="weapon-name" id="weaponName">SIDEARM · M12</div><div class="ammo"><span id="ammo">12</span> <small>/ <span id="reserve">48</span></small></div></div>
    <div id="cross" class="cross"></div><div id="prompt" class="panel"><span class="key">E</span><span id="promptText">INTERACT</span></div><div id="toast" class="panel"></div>
  </div>
  <div id="menu"><div class="card panel"><button class="close" id="closeMenu">CLOSE</button><h2>FIELD KIT</h2><div class="grid"><div class="item"><div class="eyebrow">Salvage</div><div class="resource" id="salvageCount">0 units</div><button id="craftMed">Craft medkit · 2</button></div><div class="item"><div class="eyebrow">Medical</div><div class="resource" id="medCount">1 medkit</div><button id="useMed">Use medkit</button></div><div class="item"><div class="eyebrow">Weapons</div><div class="resource">M12 Sidearm · PULSE-9</div><button id="reloadBtn">Reload weapon</button></div><div class="item"><div class="eyebrow">System</div><div class="resource" id="saveState">Checkpoint not saved</div><button id="saveBtn">Save progress</button></div></div></div></div>
  <div id="joy" class="touch"><div class="stick" id="stick"></div></div><div id="mobileAction" class="touch action">USE</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
